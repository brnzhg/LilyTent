[project]
name = "lilytent"
version = "0.1.0"
description = "Parametric 3D-printable Lily58 case with built-in tenting (build123d)"
readme = "README.md"
authors = [
    { name = "Brian Zhang", email = "brnzhg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
]

[project.scripts]
lilytent = "lilytent.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "numpy>=2.5.5",
    "ocp-viewer>=1.2.0",
    "ocp-vscode>=4.2.0",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 120

[tool.mypy]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These ship without type information.
module = ["ocp_vscode.*", "OCP.*"]
ignore_missing_imports = true
